{# todo/templates/todo/includes/task_item.html #}
<li class="task-item">
    <span class="{% if task.completed %}completed{% endif %}">
        {{ task.title }}
    </span>
    <div class="task-actions">
        <form method="post" action="{% url 'toggle_task' task.id %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">
                {% if task.completed %}Mark incomplete{% else %}Mark complete{% endif %}
            </button>
        </form>
        <form method="post" action="{% url 'delete_task' task.id %}" style="display:inline;">
            {% csrf_token %}
            <button class="danger" type="submit">Delete</button>
        </form>
    </div>
</li>
