<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ES6 To-Do App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 16px;
        }

        h1 {
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            flex: 1;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button#addBtn {
            padding: 8px 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }

        button#addBtn:hover {
            background: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        li:hover {
            background: #f9f9f9;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: darkred;
        }
    </style>
</head>
<body>
    <h1>My To-Do List</h1>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Enter a task...">
        <button id="addBtn">Add</button>
    </div>
    <ul id="taskList"></ul>

    <script src="app.js"></script>
</body>
</html>
